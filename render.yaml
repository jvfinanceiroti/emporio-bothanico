# Configuração para Deploy no Render.com
# Este arquivo configura TUDO automaticamente!

services:
  # Backend (API Node.js)
  - type: web
    name: emporio-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: emporio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001
    healthCheckPath: /produtos

  # Frontend (Next.js)
  - type: web
    name: emporio-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: emporio-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_SITE_URL
        value: https://emporiobothanico.com.br

# Banco de Dados PostgreSQL
databases:
  - name: emporio-db
    databaseName: loja
    user: loja_user
    plan: free
    region: oregon
    postgresMajorVersion: 15
